<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 38" width="190" height="38">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
      .logo-text {
        font-family: 'Outfit', 'Space Grotesk', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 24px;
        letter-spacing: -0.04em;
      }
      .orange-text {
        fill: #f97316;
      }
      .dark-text {
        fill: #000000;
      }
    </style>
  </defs>
  <g transform="translate(0, 3)">
    <!-- Logo Text -->
    <text x="2" y="24" class="logo-text">
      <tspan class="orange-text">restaurant</tspan><tspan class="dark-text">36</tspan>
    </text>
    
    <!-- Cutlery Circle ("0") -->
    <g transform="translate(167, 16)">
      <circle cx="0" cy="0" r="14" fill="#000000" />
      
      <!-- Knife -->
      <path d="M -7.5,-5 C -8.5,-5 -8.5,-1 -8.5,3 H -6 V -3 C -6,-4 -6.5,-5 -7.5,-5 Z" fill="#ffffff" />
      <rect x="-7.2" y="3" width="1.1" height="6.5" rx="0.3" fill="#ffffff" />
      
      <!-- Fork -->
      <path d="M -2,-2 C -2,0.8 1.8,0.8 1.8,-2 v -4 h -0.7 v 3.2 c 0,0.6 -0.7,0.6 -0.7,0 v -3.2 h -0.7 v 3.2 c 0,0.6 -0.7,0.6 -0.7,0 v -3.2 h -0.7 Z" fill="#ffffff" />
      <rect x="-0.8" y="1.2" width="1.1" height="7.2" rx="0.3" fill="#ffffff" />
      
      <!-- Spoon -->
      <ellipse cx="6" cy="-2.5" rx="2.1" ry="3" fill="#ffffff" />
      <rect x="5.5" y="1" width="1.1" height="7.5" rx="0.3" fill="#ffffff" />
    </g>
  </g>
</svg>
