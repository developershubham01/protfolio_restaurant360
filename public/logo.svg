<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 45" width="200" height="45">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;display=swap');
      .logo-text {
        font-family: 'Outfit', 'Space Grotesk', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 25px;
        letter-spacing: -0.04em;
      }
      .orange-text {
        fill: #ea580c;
      }
      .dark-text {
        fill: #0f172a;
      }
    </style>
  </defs>
  <g transform="translate(0, 5)">
    <!-- Logo Text -->
    <text x="5" y="26" class="logo-text">
      <tspan class="orange-text">restaurant</tspan><tspan class="dark-text">360</tspan>
    </text>
    
    <!-- Circle Icon -->
    <circle cx="178" cy="17" r="15" fill="#0f172a" />
    
    <!-- Knife -->
    <path d="M 169.2,11.5 C 168,11.5 168,15.5 168,20 H 170.8 V 13.5 C 170.8,12.5 170.2,11.5 169.2,11.5 Z" fill="#ffffff" />
    <rect x="169.5" y="20" width="1.2" height="9" rx="0.4" fill="#ffffff" />
    
    <!-- Fork -->
    <path d="M 174.5,15.5 C 174.5,18.5 178.7,18.5 178.7,15.5 v -4 h -0.8 v 4 c 0,0.8 -0.9,0.8 -0.9,0 v -4 h -0.8 v 4 c 0,0.8 -0.9,0.8 -0.9,0 v -4 h -0.8 Z" fill="#ffffff" />
    <rect x="175.9" y="19.5" width="1.2" height="9.5" rx="0.4" fill="#ffffff" />
    
    <!-- Spoon -->
    <ellipse cx="185" cy="14.5" rx="2.4" ry="3.4" fill="#ffffff" />
    <rect x="184.4" y="19" width="1.2" height="10" rx="0.4" fill="#ffffff" />
  </g>
</svg>
